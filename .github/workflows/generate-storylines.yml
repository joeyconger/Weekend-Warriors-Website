name: Generate Storylines

on:
  schedule:
    # Tuesdays 09:00 UTC — after Monday Night Football wraps up.
    - cron: "0 9 * * 2"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger generation endpoint
        run: |
          # Strip any trailing slash so we never send a double slash
          # (Next.js's router 404s on "//api/..." instead of matching it).
          clean_site_url="${SITE_URL%/}"
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${clean_site_url}/api/generate-storylines" \
            -H "Authorization: Bearer ${GENERATION_SECRET}")
          echo "HTTP status: ${http_code}"
          cat response.json
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GENERATION_SECRET: ${{ secrets.GENERATION_SECRET }}
      - name: TEMP diagnostic — map roster 2/3 to team names, dump full storylines page
        run: |
          LEAGUE_ID=1315737573154390016
          echo "--- Roster -> team/manager names ---"
          curl -s "https://api.sleeper.app/v1/league/${LEAGUE_ID}/rosters" -o rosters.json
          curl -s "https://api.sleeper.app/v1/league/${LEAGUE_ID}/users" -o users.json
          jq -r '.[] | "\(.roster_id): owner_id=\(.owner_id)"' rosters.json
          jq -r '.[] | "\(.user_id): team_name=\(.metadata.team_name // "null"), display_name=\(.display_name)"' users.json
          clean_site_url="${SITE_URL%/}"
          curl -s "${clean_site_url}/storylines" -o storylines.html
          echo "--- Full text of trade recap cards ---"
          grep -oE '<h3[^>]*>Trade Recap[^<]*</h3>[[:space:]]*<p[^>]*>[^<]*</p>' storylines.html || true
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
