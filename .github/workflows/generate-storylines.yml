name: Generate Storylines

on:
  schedule:
    # Tuesdays 09:00 UTC — after Monday Night Football wraps up.
    - cron: "0 9 * * 2"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger generation endpoint
        run: |
          # Strip any trailing slash so we never send a double slash
          # (Next.js's router 404s on "//api/..." instead of matching it).
          clean_site_url="${SITE_URL%/}"
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${clean_site_url}/api/generate-storylines" \
            -H "Authorization: Bearer ${GENERATION_SECRET}")
          echo "HTTP status: ${http_code}"
          cat response.json
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GENERATION_SECRET: ${{ secrets.GENERATION_SECRET }}
      - name: TEMP one-off — clear, regenerate, verify varied phrasing
        run: |
          clean_site_url="${SITE_URL%/}"
          curl -s -X DELETE "${clean_site_url}/api/generate-storylines" -H "Authorization: Bearer ${GENERATION_SECRET}"
          echo
          curl -s -X POST "${clean_site_url}/api/generate-storylines" -H "Authorization: Bearer ${GENERATION_SECRET}"
          echo
          curl -s "${clean_site_url}/storylines" -o storylines.html
          echo "--- Full text of trade recap cards ---"
          grep -oE '<h3[^>]*>Trade Recap[^<]*</h3>[[:space:]]*<p[^>]*>[^<]*</p>' storylines.html || true
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GENERATION_SECRET: ${{ secrets.GENERATION_SECRET }}
