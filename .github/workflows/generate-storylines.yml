name: Generate Storylines

on:
  schedule:
    # Tuesdays 09:00 UTC — after Monday Night Football wraps up.
    - cron: "0 9 * * 2"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: TEMP diagnostic — what does SITE_URL actually serve
        run: |
          clean_site_url="${SITE_URL%/}"
          echo "Length of SITE_URL secret: ${#SITE_URL}"
          echo "--- GET /api/health ---"
          curl -s -o /dev/null -w "status=%{http_code} url_effective=%{url_effective}\n" "${clean_site_url}/api/health"
          echo "--- GET / ---"
          curl -s -o /dev/null -w "status=%{http_code}\n" "${clean_site_url}/"
          echo "--- POST /api/generate-storylines (verbose headers) ---"
          curl -sv -X POST "${clean_site_url}/api/generate-storylines" -H "Authorization: Bearer x" 2>&1 | head -40
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
      - name: Trigger generation endpoint
        run: |
          # Strip any trailing slash so we never send a double slash
          # (Next.js's router 404s on "//api/..." instead of matching it).
          clean_site_url="${SITE_URL%/}"
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${clean_site_url}/api/generate-storylines" \
            -H "Authorization: Bearer ${GENERATION_SECRET}")
          echo "HTTP status: ${http_code}"
          cat response.json
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GENERATION_SECRET: ${{ secrets.GENERATION_SECRET }}
